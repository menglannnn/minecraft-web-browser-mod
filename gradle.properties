# Gradle 构建配置
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 如果你机器上 Gradle 找不到 JDK 21，取消下一行注释并改成你自己的 JDK 21 路径
# org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21.0.12

# ---- 开发环境：NeoForge 早期加载窗口（那个花哨的加载动画） ----
# 上游已知 bug：部分启动会随机在早期加载窗口里抛 FileSystemNotFoundException 直接崩掉
#   cpw.mods.niofs.union.UnionFileSystemProvider.getFileSystem
#   （NeoForge 维护者 ChampionAsh5357 也复现过同一份崩溃报告）
# 关掉早期加载窗口就能完全绕开这条路径。等上游修好后把它改成 true 即可看回加载动画。
neoforge.earlyWindowControl=false

# ---- 模组 / 游戏版本 ----
minecraft_version=1.21.1
neo_version=21.1.257

mod_id=webscreen
mod_name=Web Screen
mod_version=1.0.0
mod_group_id=com.webscreen
mod_authors=WebScreen
mod_license=MIT
mod_description=A placeable 1x2 web screen block. Right-click it to type a URL and the page (including video) plays inside Minecraft.

# MCEF: 在 Minecraft 里内嵌 Chromium 的库（客户端必需）
mcef_version=2.1.6-1.21.1
